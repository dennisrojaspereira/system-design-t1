# System Design na Prática — Aula 01: encurtador de links.
# O arquivo .env (copiado de labs/labN.env pelo `make labN`) decide qual
# estágio da arquitetura está ligado.
name: sd-aula01

x-app: &app
  image: sd-aula01-shortener   # as três instâncias usam a mesma imagem
  build: ./app
  cpus: 1
  environment:
    DATABASE_URL: postgres://shortener:shortener@pg:5432/shortener
    DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
    DB_POOL_MAX: ${DB_POOL_MAX:-10}
    ID_STRATEGY: ${ID_STRATEGY:-counter}
    CODE_LENGTH: ${CODE_LENGTH:-7}
    CACHE_ENABLED: ${CACHE_ENABLED:-false}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-1000}
    ANALYTICS_MODE: ${ANALYTICS_MODE:-off}
    BASE_URL: http://localhost:${APP_PORT:-8080}
  depends_on:
    pg:
      condition: service_healthy
  healthcheck:
    test: wget -qO- http://127.0.0.1:8080/healthz
    interval: 2s
    retries: 60

services:
  # ---------- aplicação ----------
  app1:
    <<: *app
    ports: ["${APP_PORT:-8080}:8080"]
  app2:
    <<: *app
    profiles: [ha]
  app3:
    <<: *app
    profiles: [ha]

  lb:
    image: nginx:1.27-alpine
    profiles: [ha]
    volumes: ["./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${LB_PORT:-8000}:80"]
    depends_on: [app1, app2, app3]

  # ---------- dados ----------
  pg:
    image: postgres:16-alpine
    cpus: ${PG_CPUS:-0.2}   # limite proposital: o gargalo aparece no notebook
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-replication.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U shortener -h 127.0.0.1
      interval: 2s
      retries: 30

  pg-replica:
    image: postgres:16-alpine
    profiles: [replica]
    user: postgres
    cpus: ${PG_CPUS:-0.2}
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICA_APPLY_DELAY: ${REPLICA_APPLY_DELAY:-0}
    volumes:
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - pgreplica:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U shortener -h 127.0.0.1
      interval: 2s
      retries: 60
    depends_on:
      pg:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --maxmemory 64mb --maxmemory-policy allkeys-lru

  # ---------- observabilidade ----------
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # o k6 envia as métricas dele para cá
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["${PROM_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/encurtador.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

  pg-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://shortener:shortener@pg:5432/shortener?sslmode=disable
    depends_on:
      pg:
        condition: service_healthy

  pg-replica-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [replica]
    environment:
      DATA_SOURCE_NAME: postgresql://shortener:shortener@pg-replica:5432/shortener?sslmode=disable
    depends_on: [pg-replica]

  # ---------- interface visual ----------
  # Página para criar links, testar o redirect e ver um resumo das métricas.
  ui:
    image: nginx:1.27-alpine
    environment:
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      PROM_PORT: ${PROM_PORT:-9090}
      # Só usadas pelo botão "Kubernetes": o mesmo lab num cluster local, se houver.
      K8S_APP_PORT: ${K8S_APP_PORT:-8082}
      K8S_PROM_PORT: ${K8S_PROM_PORT:-9091}
      K8S_GRAFANA_PORT: ${K8S_GRAFANA_PORT:-3002}
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${UI_PORT:-8090}:80"]

  # ---------- carga ----------
  k6:
    image: grafana/k6:2.4.0
    profiles: [tools]
    volumes: ["./k6:/scripts:ro"]
    environment:
      TARGET: ${TARGET:-http://app1:8080}
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99)
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s

volumes:
  pgdata:
  pgreplica:
  promdata:
