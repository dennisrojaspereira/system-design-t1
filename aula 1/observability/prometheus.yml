global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # Descobre as instâncias por DNS: no MVP só existe app1; no Lab 4 aparecem app2 e app3.
  - job_name: app
    dns_sd_configs:
      - names: [app1, app2, app3]
        type: A
        port: 8080
        refresh_interval: 2s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance

  - job_name: postgres
    static_configs:
      - targets: [pg-exporter:9187]
        labels: { db: primary }

  - job_name: postgres-replica
    dns_sd_configs:
      - names: [pg-replica-exporter]
        type: A
        port: 9187
    relabel_configs:
      - target_label: db
        replacement: replica
