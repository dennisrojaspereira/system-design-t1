# Balanceador do Lab 4: três instâncias da aplicação, round-robin.
# max_fails/fail_timeout = health check passivo: depois de 1 falha, a
# instância fica 5s fora da rotação. proxy_next_upstream reenvia a
# requisição que falhou para outra instância — o cliente não vê o erro.
#
# Só erro de conexão e timeout contam como falha. Experimento do Lab 4:
# acrescente `http_503` na linha do proxy_next_upstream, derrube o Postgres
# e veja uma falha parcial virar indisponibilidade total.
upstream shortener {
    server app1:8080 max_fails=1 fail_timeout=5s;
    server app2:8080 max_fails=1 fail_timeout=5s;
    server app3:8080 max_fails=1 fail_timeout=5s;
    keepalive 256;
}

server {
    listen 80;
    access_log off;

    location / {
        proxy_pass http://shortener;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
    }
}
