global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8080]

  - job_name: edge
    static_configs:
      - targets: [edge:8081]

  # Descobre os workers por DNS: com WORKERS=3 aparecem três alvos.
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8080
        refresh_interval: 2s
